<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FilaZero - Retorno do pagamento</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topo"><div class="logo">🍴 FilaZero</div><div class="usuario"><a href="meus-pedidos.html">Meus pedidos</a></div></header><main class="pagina"><section class="pix-container"><div class="pix-conteudo"><h1 id="titulo">Estamos verificando seu pagamento</h1><p id="mensagem">Aguarde enquanto confirmamos a resposta do Mercado Pago. Não faça outro pagamento.</p><p id="estado" class="pix-status">Consultando...</p><a href="meus-pedidos.html">Acompanhar meus pedidos</a></div></section></main><script>
const parametros = new URLSearchParams(location.search);
const pedido = parametros.get('pedido');
const paymentId = parametros.get('payment_id');
const titulo=document.getElementById('titulo'), mensagem=document.getElementById('mensagem'), estado=document.getElementById('estado');
async function verificar(){ if(!pedido){estado.textContent='Não foi possível identificar o pedido.';return;} try{const r=await fetch('/api/pedidos/'+encodeURIComponent(pedido)+'/pagamento'+(paymentId?'?payment_id='+encodeURIComponent(paymentId):''));const d=await r.json();if(!r.ok||!d.sucesso){estado.textContent='Não foi possível consultar o pedido.';return;}if(d.pagamento_status==='Pago'){titulo.textContent='Pagamento aprovado! 💚';mensagem.textContent='Seu pedido foi confirmado e enviado à cantina.';estado.textContent='Pagamento confirmado';estado.className='pix-status pix-pago';return;}if(['Recusado','Cancelado','Estornado','Falha'].includes(d.pagamento_status)){titulo.textContent='Pagamento não aprovado';mensagem.textContent='Consulte seus pedidos ou fale com a cantina.';estado.textContent=d.pagamento_status;estado.className='pix-status pix-erro';return;}estado.textContent='Pagamento ainda pendente. Estamos aguardando a confirmação do Mercado Pago.';setTimeout(verificar,5000);}catch(e){estado.textContent='Falha ao consultar. Atualize a página em instantes.';}}
verificar();
</script></body></html>
